name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build ruff
      - run: python -m pip install -e .
      - run: python -m compileall -q src
      - run: ruff check src --select E9,F63,F7,F82
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -q -f native/balana/pom.xml -Dmaven.repo.local="${{ github.workspace }}/.runtime/m2" package dependency:copy-dependencies
      - run: python -m unittest discover -s tests
        env:
          DENIALSAFE_BALANA_CLASSPATH: "${{ github.workspace }}/native/balana/target/classes:${{ github.workspace }}/native/balana/target/dependency/*"
      - run: python -m build

