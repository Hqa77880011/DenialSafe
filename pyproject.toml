[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "denialsafe"
version = "0.1.0"
description = "Public-view robust authorization recourse implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "psutil>=5.9", "scipy>=1.11"]

[project.scripts]
denialsafe = "denialsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

